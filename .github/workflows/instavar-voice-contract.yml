name: Instavar Voice contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  capability-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out companion repository
        uses: actions/checkout@v5
      - name: Check out pinned evaluation contract
        uses: actions/checkout@v5
        with:
          repository: instavar/instavar-voice-evaluation
          ref: d9774ad79e127458ca06cf49003283c0272b950e
          path: .instavar-voice-evaluation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate repository capability manifest
        run: python .instavar-voice-evaluation/main.py validate-repository "$GITHUB_WORKSPACE"
      - name: Verify executed evaluator APIs
        env:
          PYTHONPATH: .instavar-voice-evaluation
        run: python -c "from inspect import signature; from instavar_voice_lab.extraction import EXECUTED_ASR_EXTRACTION_SCHEMA_VERSION as a, EXECUTED_MULTI_REFERENCE_EXTRACTION_SCHEMA_VERSION as x, PLANNED_MULTI_REFERENCE_EXTRACTION_SCHEMA_VERSION as v; from instavar_voice_lab.faster_whisper import FASTER_WHISPER_BACKEND as f; from instavar_voice_lab.listening import LISTENING_ASSIGNMENT_PLAN_SCHEMA_VERSION as q, LISTENING_PRESENTATION_SCHEDULE_SCHEMA_VERSION as o, LISTENING_RATER_PACKET_SCHEMA_VERSION as k, LISTENING_RATER_SUBMISSION_SCHEMA_VERSION as u, LISTENING_ROUTING_SCHEMA_VERSION as r, build_listening_assignment_plan as z; from instavar_voice_lab.metrics import PLAN_CATEGORY_STRATIFICATION_VERSION as c, PLAN_LEXICAL_ANCHOR_EVIDENCE_VERSION as l, score_objective_observations as s; from instavar_voice_lab.speaker_reference_plans import ASSIGNMENT_PLAN_SCHEMA_VERSION as p; from instavar_voice_lab.speechbrain_ecapa import SPEECHBRAIN_ECAPA_BACKEND as b; assert (a, x, v, p, c, l, q, r, o, k, u, b, f) == ('1.5.0', '1.4.0', '1.3.0', '1.0.0', '1.0.0', '1.0.0', '1.3.0', '1.1.0', '1.0.0', '1.0.0', '1.0.0', 'instavar_voice_lab.speechbrain_ecapa_v1', 'instavar_voice_lab.faster_whisper_v1'); assert 'generation_plan' in signature(s).parameters; assert list(signature(z).parameters) == ['generation_plan', 'routing', 'allow_unmatched_routes']"
      - name: Verify content-faithfulness evaluator API
        env:
          PYTHONPATH: .instavar-voice-evaluation
        run: python -c "from inspect import signature; from instavar_voice_lab.content_faithfulness import CONTENT_FAITHFULNESS_SCHEMA_VERSION as v, build_content_faithfulness_report as b; assert v == 'instavar_voice_content_faithfulness/v1'; assert {'generation_plan', 'reference_catalog', 'reference_assignment_plan', 'speaker_references'} <= set(signature(b).parameters)"
      - name: Validate historical run evidence
        run: python .instavar-voice-evaluation/main.py validate historical historical-run.json
      - name: Validate executable lifecycle backend
        run: python .instavar-voice-evaluation/main.py validate-backend instavar-voice-backend.json
      - name: Test repository contracts without model dependencies
        env:
          PYTHONPATH: .instavar-voice-evaluation
        run: python -m unittest discover -s tests -v
